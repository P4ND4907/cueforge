name: Audio Ingest QA

on:
  pull_request:
    paths:
      - '.github/workflows/audio-ingest-qa.yml'
      - 'docs/AUDIO_INGEST_QA_GATE.md'
      - 'package.json'
      - 'package-lock.json'
      - 'src/core/audioIngestQaGate.js'
      - 'src/tests/audioIngestQaGate.test.js'
      - 'src/tests/audioIngestWorkflow.test.js'
      - 'qa/audio/export-manifest.json'
      - 'tools/Measure-AudioIngestMetrics.py'
      - 'tools/Run-AudioIngestQa.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-ingest-qa.yml'
      - 'docs/AUDIO_INGEST_QA_GATE.md'
      - 'package.json'
      - 'package-lock.json'
      - 'src/core/audioIngestQaGate.js'
      - 'src/tests/audioIngestQaGate.test.js'
      - 'src/tests/audioIngestWorkflow.test.js'
      - 'qa/audio/export-manifest.json'
      - 'tools/Measure-AudioIngestMetrics.py'
      - 'tools/Run-AudioIngestQa.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-ingest-qa:
    name: Audio ingest fixture gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python audio metrics dependencies
        run: pip install numpy soundfile pyloudnorm

      - name: Verify toolchain
        run: |
          ffmpeg -version
          ffprobe -version
          python --version

      - name: Build deterministic stereo fixture
        run: |
          mkdir -p qa/audio/ci
          ffmpeg -hide_banner -y \
            -f lavfi -i "sine=frequency=1000:duration=2:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1200:duration=2:sample_rate=48000" \
            -filter_complex "[0:a][1:a]amerge=inputs=2[a]" \
            -map "[a]" \
            -ac 2 \
            -c:a pcm_s24le \
            qa/audio/ci/stereo-pass.wav

      - name: Run CueForge audio ingest manifest gate
        run: npm run qa:audio-ingest -- --manifest qa/audio/export-manifest.json --output-dir qa/audio/ci --summary-json qa/audio/ci/audio-ingest-summary.json

      - name: Verify workflow contract tests
        run: npm test -- src/tests/audioIngestQaGate.test.js src/tests/audioIngestWorkflow.test.js

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cueforge-audio-ingest-qa
          path: |
            qa/audio/ci/**/*.json
          if-no-files-found: error
